<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Activity Tracker</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'indigo-50': '#f0f5ff',
                        'indigo-600': '#4f46e5',
                        'indigo-700': '#4338ca',
                        'purple-50': '#f6f4ff',
                        'purple-600': '#7c3aed',
                        'purple-700': '#6d28d9',
                        'pink-50': '#fdf2f8',
                        'pink-600': '#db2777',
                        'pink-700': '#be185d',
                        'green-600': '#16a34a',
                        'green-700': '#15803d',
                        'emerald-600': '#059669',
                        'emerald-700': '#047857',
                        'blue-600': '#2563eb',
                        'blue-700': '#1d4ed8'
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-white">
    <div id="app" class="min-h-screen"></div>

    <script>
        // --- ICONS ---
        const icons = {
            users: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>',
            calendar: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>',
            fileText: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>',
            eye: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>',
            logOut: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>',
            edit3: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>',
            trash2: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>',
            settings: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>',
            user: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>',
            alertCircle: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>',
            checkCircle: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>',
            x: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>',
            save: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 12 8"></polyline></svg>',
            lock: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>',
            shield: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>'
        };

        // --- APP LOGIC ---
        class App {
            constructor() {
                this.state = {
                    currentView: 'login',
                    currentUser: null,
                    entries: JSON.parse(localStorage.getItem('tracker_entries')) || {},
                    newEntry: {
                        areaOfWork: '',
                        task: '',
                        faultNotice: '',
                        actionExecuted: '',
                        observation: '',
                        faultNotification: '',
                        timeOfExecution: new Date().toISOString().slice(0, 16)
                    },
                    loginName: '',
                    signupName: '',
                    managerName: '',
                    managerPassword: '',
                    managerLoginPassword: '',
                    error: '',
                    isEditingName: false,
                    editedName: '',
                    showDeleteConfirm: false,
                    managerExists: localStorage.getItem('tracker_manager') ? true : false,
                    managerPasswordHash: localStorage.getItem('tracker_manager_pw') || ''
                };
                this.render();
                this.setupEventListeners();
            }

            setState(newState) {
                this.state = {...this.state, ...newState};
                this.render();
            }
            
            saveData() {
                localStorage.setItem('tracker_entries', JSON.stringify(this.state.entries));
            }

            setupEventListeners() {
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && e.target.tagName === 'INPUT') {
                        const form = e.target.form;
                        if (form) {
                            const index = Array.prototype.indexOf.call(form.querySelectorAll('input, textarea, button'), e.target);
                            const next = form.querySelectorAll('input, textarea, button')[index + 1];
                            if (next) {
                                next.focus();
                                e.preventDefault();
                            }
                        }
                    }
                });
            }

            handleLogin(name) {
                if (!name.trim()) {
                    this.setState({ error: 'Please enter your name' });
                    return;
                }
                
                const trimmedName = name.trim();
                if (this.state.entries[trimmedName]) {
                    this.setState({
                        currentUser: trimmedName,
                        currentView: 'dashboard',
                        error: ''
                    });
                } else {
                    this.setState({ error: 'User not found. Please sign up first.' });
                }
            }

            handleSignup(name) {
                if (!name.trim()) {
                    this.setState({ error: 'Please enter your name' });
                    return;
                }
                
                const trimmedName = name.trim();
                if (this.state.entries[trimmedName]) {
                    this.setState({ error: 'User already exists. Please log in.' });
                    return;
                }
                
                const newEntries = {...this.state.entries};
                newEntries[trimmedName] = [];
                
                this.setState({
                    entries: newEntries,
                    currentUser: trimmedName,
                    currentView: 'dashboard',
                    error: ''
                });
                this.saveData();
            }

            handleManagerSignup() {
                if (!this.state.managerName.trim()) {
                    this.setState({ error: 'Please enter your name' });
                    return;
                }
                if (this.state.managerPassword.length < 8) {
                    this.setState({ error: 'Password must be at least 8 characters long' });
                    return;
                }
                
                const trimmedName = this.state.managerName.trim();
                const newEntries = {...this.state.entries};
                if (!newEntries[trimmedName]) {
                    newEntries[trimmedName] = [];
                }

                localStorage.setItem('tracker_manager', 'true');
                localStorage.setItem('tracker_manager_pw', this.state.managerPassword);
                
                this.setState({
                    managerExists: true,
                    managerPasswordHash: this.state.managerPassword,
                    entries: newEntries,
                    currentUser: trimmedName,
                    currentView: 'dashboard',
                    error: ''
                });
                this.saveData();
            }

            handleManagerLogin() {
                if (!this.state.managerLoginPassword) {
                    this.setState({ error: 'Please enter your password' });
                    return;
                }
                if (this.state.managerLoginPassword !== this.state.managerPasswordHash) {
                    this.setState({ error: 'Invalid password' });
                    return;
                }
                
                this.setState({
                    currentUser: 'Manager',
                    currentView: 'dashboard',
                    error: ''
                });
            }

            handleAddEntry() {
                if (!this.state.newEntry.areaOfWork || !this.state.newEntry.task) return;
                
                const entry = {
                    id: Date.now(),
                    ...this.state.newEntry,
                    createdAt: new Date().toISOString()
                };

                const userEntries = this.state.entries[this.state.currentUser] || [];
                const newEntries = {...this.state.entries};
                newEntries[this.state.currentUser] = [...userEntries, entry];

                this.setState({
                    entries: newEntries,
                    newEntry: {
                        areaOfWork: '',
                        task: '',
                        faultNotice: '',
                        actionExecuted: '',
                        observation: '',
                        faultNotification: '',
                        timeOfExecution: new Date().toISOString().slice(0, 16)
                    }
                });
                this.saveData();
            }

            handleDeleteEntry(entryId) {
                 const userEntries = this.state.entries[this.state.currentUser] || [];
                 const newEntries = {...this.state.entries};
                 newEntries[this.state.currentUser] = userEntries.filter(e => e.id !== entryId);
                 this.setState({ entries: newEntries });
                 this.saveData();
            }

             handleLogout() {
                this.setState({
                    currentUser: null,
                    currentView: 'login',
                    error: '',
                    loginName: '',
                    signupName: '',
                    managerLoginPassword: ''
                });
            }

            formatDate(dateString) {
                return new Date(dateString).toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            }

            render() {
                const app = document.getElementById('app');
                
                if (this.state.currentView === 'login') {
                    app.innerHTML = `
                        <div class="flex min-h-screen flex-col justify-center px-6 py-12 lg:px-8 bg-gray-50">
                            <div class="sm:mx-auto sm:w-full sm:max-w-sm">
                                <div class="mx-auto h-12 w-12 text-indigo-600">${icons.calendar}</div>
                                <h2 class="mt-10 text-center text-2xl font-bold leading-9 tracking-tight text-gray-900">
                                    Daily Activity Tracker
                                </h2>
                            </div>

                            <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-sm">
                                <div class="bg-white px-6 py-8 shadow sm:rounded-lg sm:px-10">
                                    ${this.state.error ? `
                                        <div class="mb-4 rounded-md bg-red-50 p-4">
                                            <div class="flex">
                                                <div class="flex-shrink-0 text-red-400">${icons.alertCircle}</div>
                                                <div class="ml-3">
                                                    <h3 class="text-sm font-medium text-red-800">${this.state.error}</h3>
                                                </div>
                                            </div>
                                        </div>
                                    ` : ''}

                                    <div class="mb-6 flex rounded-md shadow-sm" role="group">
                                        <button onclick="window.app.setState({currentTab: 'user', error: ''})" 
                                            class="flex-1 px-4 py-2 text-sm font-medium border rounded-l-lg ${this.state.currentTab !== 'manager' ? 'bg-indigo-600 text-white' : 'bg-white text-gray-700 hover:bg-gray-50'}">
                                            Employee
                                        </button>
                                        <button onclick="window.app.setState({currentTab: 'manager', error: ''})" 
                                            class="flex-1 px-4 py-2 text-sm font-medium border rounded-r-lg ${this.state.currentTab === 'manager' ? 'bg-indigo-600 text-white' : 'bg-white text-gray-700 hover:bg-gray-50'}">
                                            Manager
                                        </button>
                                    </div>

                                    ${this.state.currentTab === 'manager' ? `
                                        ${!this.state.managerExists ? `
                                            <div class="space-y-6">
                                                <div>
                                                    <label class="block text-sm font-medium leading-6 text-gray-900">Manager Name</label>
                                                    <div class="mt-2">
                                                        <input type="text" value="${this.state.managerName}" 
                                                            oninput="window.app.setState({managerName: this.value})"
                                                            class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6 pl-3">
                                                    </div>
                                                </div>
                                                <div>
                                                    <label class="block text-sm font-medium leading-6 text-gray-900">Set Password</label>
                                                    <div class="mt-2">
                                                        <input type="password" value="${this.state.managerPassword}"
                                                            oninput="window.app.setState({managerPassword: this.value})"
                                                            class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6 pl-3">
                                                    </div>
                                                </div>
                                                <button onclick="window.app.handleManagerSignup()" class="flex w-full justify-center rounded-md bg-indigo-600 px-3 py-1.5 text-sm font-semibold leading-6 text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">
                                                    Create Manager Account
                                                </button>
                                            </div>
                                        ` : `
                                            <div class="space-y-6">
                                                <div>
                                                    <label class="block text-sm font-medium leading-6 text-gray-900">Password</label>
                                                    <div class="mt-2">
                                                        <input type="password" value="${this.state.managerLoginPassword}"
                                                            oninput="window.app.setState({managerLoginPassword: this.value})"
                                                            class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6 pl-3">
                                                    </div>
                                                </div>
                                                <button onclick="window.app.handleManagerLogin()" class="flex w-full justify-center rounded-md bg-indigo-600 px-3 py-1.5 text-sm font-semibold leading-6 text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">
                                                    Sign in as Manager
                                                </button>
                                            </div>
                                        `}
                                    ` : `
                                        <div class="space-y-6">
                                            <div>
                                                <label class="block text-sm font-medium leading-6 text-gray-900">Name</label>
                                                <div class="mt-2">
                                                    <input type="text" value="${this.state.loginName}"
                                                        oninput="window.app.setState({loginName: this.value})"
                                                        class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6 pl-3">
                                                </div>
                                            </div>
                                            <div class="flex gap-3">
                                                <button onclick="window.app.handleLogin(window.app.state.loginName)" class="flex-1 justify-center rounded-md bg-indigo-600 px-3 py-1.5 text-sm font-semibold leading-6 text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">
                                                    Log In
                                                </button>
                                                <button onclick="window.app.handleSignup(window.app.state.loginName)" class="flex-1 justify-center rounded-md bg-white px-3 py-1.5 text-sm font-semibold leading-6 text-indigo-600 shadow-sm ring-1 ring-inset ring-indigo-600 hover:bg-indigo-50">
                                                    Sign Up
                                                </button>
                                            </div>
                                        </div>
                                    `}
                                </div>
                            </div>
                        </div>
                    `;
                } else if (this.state.currentView === 'dashboard') {
                    const isManager = this.state.currentUser === 'Manager';
                    
                    app.innerHTML = `
                        <div class="min-h-screen bg-gray-50 pb-12">
                            <nav class="bg-indigo-600">
                                <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
                                    <div class="flex h-16 items-center justify-between">
                                        <div class="flex items-center">
                                            <div class="text-white">${icons.calendar}</div>
                                            <span class="ml-2 text-white font-bold">Activity Tracker</span>
                                        </div>
                                        <div class="flex items-center gap-4">
                                            <span class="text-indigo-100 text-sm">Hello, ${isManager ? 'Manager' : this.state.currentUser}</span>
                                            <button onclick="window.app.handleLogout()" class="text-indigo-100 hover:text-white">
                                                ${icons.logOut}
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </nav>

                            <main class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
                                ${isManager ? this.renderManagerView() : this.renderEmployeeView()}
                            </main>
                        </div>
                    `;
                }
            }

            renderEmployeeView() {
                const entries = this.state.entries[this.state.currentUser] || [];
                
                return `
                    <div class="space-y-8">
                        <div class="bg-white shadow sm:rounded-lg">
                            <div class="px-4 py-5 sm:p-6">
                                <h3 class="text-base font-semibold leading-6 text-gray-900 mb-4">New Activity Entry</h3>
                                <div class="grid grid-cols-1 gap-x-6 gap-y-4 sm:grid-cols-6">
                                    <div class="sm:col-span-3">
                                        <label class="block text-sm font-medium leading-6 text-gray-900">Area of Work</label>
                                        <input type="text" value="${this.state.newEntry.areaOfWork}"
                                            oninput="window.app.state.newEntry.areaOfWork = this.value"
                                            class="mt-1 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6 pl-3">
                                    </div>
                                    <div class="sm:col-span-3">
                                        <label class="block text-sm font-medium leading-6 text-gray-900">Time</label>
                                        <input type="datetime-local" value="${this.state.newEntry.timeOfExecution}"
                                            oninput="window.app.state.newEntry.timeOfExecution = this.value"
                                            class="mt-1 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6 pl-3">
                                    </div>
                                    <div class="sm:col-span-6">
                                        <label class="block text-sm font-medium leading-6 text-gray-900">Task / Activity</label>
                                        <textarea rows="2" 
                                            oninput="window.app.state.newEntry.task = this.value"
                                            class="mt-1 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6 pl-3">${this.state.newEntry.task}</textarea>
                                    </div>
                                    
                                    <div class="sm:col-span-3">
                                        <label class="block text-sm font-medium leading-6 text-gray-900">Fault Notice (Optional)</label>
                                        <input type="text" value="${this.state.newEntry.faultNotice}"
                                            oninput="window.app.state.newEntry.faultNotice = this.value"
                                            class="mt-1 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6 pl-3">
                                    </div>
                                    <div class="sm:col-span-3">
                                        <label class="block text-sm font-medium leading-6 text-gray-900">Action Executed (Optional)</label>
                                        <input type="text" value="${this.state.newEntry.actionExecuted}"
                                            oninput="window.app.state.newEntry.actionExecuted = this.value"
                                            class="mt-1 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6 pl-3">
                                    </div>
                                    <div class="sm:col-span-6">
                                        <label class="block text-sm font-medium leading-6 text-gray-900">Observations (Optional)</label>
                                        <input type="text" value="${this.state.newEntry.observation}"
                                            oninput="window.app.state.newEntry.observation = this.value"
                                            class="mt-1 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6 pl-3">
                                    </div>
                                </div>
                                <div class="mt-5">
                                    <button onclick="window.app.handleAddEntry()" class="inline-flex items-center rounded-md bg-indigo-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">
                                        ${icons.save} <span class="ml-2">Save Entry</span>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div class="bg-white shadow sm:rounded-lg overflow-hidden">
                            <ul role="list" class="divide-y divide-gray-100">
                                ${entries.length === 0 ? `
                                    <li class="p-8 text-center text-gray-500">No entries yet. Start working!</li>
                                ` : entries.slice().reverse().map(entry => `
                                    <li class="gap-x-6 py-5 px-6 hover:bg-gray-50">
                                        <div class="flex justify-between items-start">
                                            <div class="min-w-0 flex-auto">
                                                <div class="flex items-center gap-2 mb-1">
                                                    <span class="inline-flex items-center rounded-md bg-blue-50 px-2 py-1 text-xs font-medium text-blue-700 ring-1 ring-inset ring-blue-700/10">${entry.areaOfWork}</span>
                                                    <span class="text-xs text-gray-500">${this.formatDate(entry.createdAt)}</span>
                                                </div>
                                                <p class="text-sm font-semibold leading-6 text-gray-900">${entry.task}</p>
                                                
                                                ${entry.faultNotice ? `
                                                    <div class="mt-2 flex items-center gap-2 text-xs text-red-600">
                                                        ${icons.alertCircle}
                                                        <span>Fault: ${entry.faultNotice}</span>
                                                    </div>
                                                ` : ''}
                                                
                                                ${entry.actionExecuted ? `
                                                    <div class="mt-1 flex items-center gap-2 text-xs text-green-600">
                                                        ${icons.checkCircle}
                                                        <span>Action: ${entry.actionExecuted}</span>
                                                    </div>
                                                ` : ''}
                                                
                                                ${entry.observation ? `
                                                    <div class="mt-1 text-xs text-gray-500 italic">
                                                        Note: ${entry.observation}
                                                    </div>
                                                ` : ''}
                                            </div>
                                            <button onclick="window.app.handleDeleteEntry(${entry.id})" class="text-gray-400 hover:text-red-600 ml-4">
                                                ${icons.trash2}
                                            </button>
                                        </div>
                                    </li>
                                `).join('')}
                            </ul>
                        </div>
                    </div>
                `;
            }

            renderManagerView() {
                const allUsers = Object.keys(this.state.entries).filter(u => u !== this.state.managerName);
                
                return `
                    <div class="space-y-6">
                        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
                            ${allUsers.map(user => {
                                const userEntries = this.state.entries[user] || [];
                                const lastEntry = userEntries[userEntries.length - 1];
                                
                                return `
                                    <div class="bg-white overflow-hidden shadow rounded-lg hover:shadow-md transition-shadow">
                                        <div class="px-4 py-5 sm:p-6">
                                            <div class="flex items-center gap-3 mb-4">
                                                <div class="bg-indigo-100 p-2 rounded-full text-indigo-600">
                                                    ${icons.user}
                                                </div>
                                                <h3 class="text-lg font-medium leading-6 text-gray-900">${user}</h3>
                                            </div>
                                            <div class="text-sm text-gray-500 mb-4">
                                                Total Entries: <span class="font-semibold text-gray-900">${userEntries.length}</span>
                                            </div>
                                            ${lastEntry ? `
                                                <div class="text-xs border-t pt-3">
                                                    <p class="text-gray-400 mb-1">Last Activity:</p>
                                                    <p class="font-medium text-gray-900 line-clamp-2">${lastEntry.task}</p>
                                                    <p class="text-gray-400 mt-1">${this.formatDate(lastEntry.createdAt)}</p>
                                                </div>
                                            ` : '<div class="text-xs text-gray-400 border-t pt-3">No activity recorded</div>'}
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            }
        }

        // PWA Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(registration => {
                        console.log('SW registered: ', registration);
                    })
                    .catch(registrationError => {
                        console.log('SW registration failed: ', registrationError);
                    });
            });
        }

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            window.app = new App();
        });
    </script>
</body>
</html>
